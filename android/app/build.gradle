plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.blackstream.app"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // ✅ معرف التطبيق الفريد
        applicationId "com.blackstream.app"
        
        // ✅ الحد الأدنى لإصدار Android (مطلوب 21 لـ flutter_inappwebview)
        minSdkVersion 21
        
        // ✅ إصدار Android المستهدف
        targetSdkVersion 34
        
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // ✅ دعم اللغات المتعددة
        multiDexEnabled true
        
        // ✅ تحديد معماريات المعالج المدعومة
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    // ✅ إعدادات التوقيع (اختياري - للـ Release)
    signingConfigs {
        release {
            // يمكنك إضافة توقيعك هنا لاحقاً
            // keyAlias 'your_key_alias'
            // keyPassword 'your_key_password'
            // storeFile file('your_key_store.jks')
            // storePassword 'your_store_password'
        }
    }

    buildTypes {
        release {
            // ✅ تصغير حجم التطبيق وتحسين الأداء
            minifyEnabled true
            shrinkResources true
            
            // ✅ قواعد ProGuard
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // signingConfig signingConfigs.release // فعّل هذا عند إضافة توقيع
        }
        
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    // ✅ إعدادات الحزم المتعددة (اختياري)
    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        prod {
            dimension "default"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // ✅ مكتبات إضافية مطلوبة
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ✅ مكتبات Google Play Services (اختياري - للإشعارات)
    // implementation 'com.google.firebase:firebase-messaging:23.4.0'
}
