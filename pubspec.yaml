name: black_stream
description: Black Stream - مشاهدة الأفلام والمسلسلات والأنمي بدون إعلانات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  html: ^0.15.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  flutter_inappwebview: ^6.1.5
  flutter_downloader: ^1.11.0
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/translations/
