name: black_stream
description: تطبيق Black Stream لمشاهدة الأفلام والمسلسلات بدون إعلانات.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # الشبكة وتحليل HTML
  dio: ^5.4.0
  html: ^0.15.4
  
  # متصفح مدمج لتجاوز الحماية واستخراج الروابط
  flutter_inappwebview: ^6.0.0

  # مشغل الفيديو
  video_player: ^2.8.1
  chewie: ^1.7.4

  # التخزين المحلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # واجهة المستخدم والصور
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # أدوات مساعدة
  connectivity_plus: ^6.0.1
  url_launcher: ^6.2.2
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
